[project]
name = "claude-code-llm"
version = "0.1.0"
description = "Inspect AI model provider that runs prompts through the local Claude Code CLI"
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.287"]

[project.entry-points.inspect_ai]
claude_code_llm = "claude_code_llm._registry"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_code_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude Code CLI (slow, uses subscription quota)"]
addopts = "-m 'not live'"
