[project]
name = "pidgin-scorer"
version = "0.1.0"
description = "Inspect AI task, LLM judge and pair scoring for the Nigerian Pidgin deployment-readiness eval"
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.287", "openai>=1.0", "pidgin-dataset", "claude-code-llm"]

[project.scripts]
pidgin-report = "pidgin_scorer.report:main"

[tool.uv.sources]
pidgin-dataset = { path = "../dataset", editable = true }
claude-code-llm = { path = "../llm", editable = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pidgin_scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
