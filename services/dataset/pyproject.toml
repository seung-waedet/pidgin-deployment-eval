[project]
name = "pidgin-dataset"
version = "0.1.0"
description = "Test item schema and checks for the Nigerian Pidgin deployment-readiness eval"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8", "pyyaml>=6.0"]

[project.scripts]
pidgin-dataset = "pidgin_dataset.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pidgin_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
